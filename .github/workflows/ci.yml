name: Healthcare Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PATH: /tmp/healthcare_agent_ci.db
      LLM_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      - name: Run test suite
        run: python -m pytest -q

      - name: Start application and smoke-test HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/healthcare-agent.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done

          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"model":"qwen-3.8-27b"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8000/ > /tmp/index.html
          grep -q 'Diagnostic Decision Support' /tmp/index.html

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/healthcare-agent.log || true

  live-indiaai:
    name: Live MAQ IndiaAI end-to-end
    needs: validate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PATH: /tmp/healthcare_agent_live.db
      LLM_TIMEOUT_SECONDS: "120"
      PYTHONPATH: .
      INDIAAI_API_KEY: ${{ secrets.INDIAAI_API_KEY || secrets.INDIAAI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify IndiaAI secret is available
        shell: bash
        run: |
          if [ -z "${INDIAAI_API_KEY:-}" ]; then
            echo "Neither INDIAAI_API_KEY nor INDIAAI repository secret is configured."
            exit 1
          fi
          echo "IndiaAI repository secret is available."

      - name: Run live Qwen probe and full clinical pipeline
        run: python scripts/live_validation.py
